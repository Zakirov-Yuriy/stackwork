name: stackwork_app
description: "Stackwork: IT-вакансии с указанной зарплатой. Мобильное приложение к сайту stackworkjobs.vercel.app."
publish_to: "none"

# versionCode растёт на единицу с каждым релизом в Google Play
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  go_router: ^17.0.0
  dio: ^5.9.0
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.5.0
  url_launcher: ^6.3.0
  share_plus: ^12.0.0
  cached_network_image: ^3.4.0
  flutter_widget_from_html_core: ^0.17.0
  intl: ^0.20.0
  package_info_plus: ^9.0.0
  cupertino_icons: ^1.0.8
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_secure_storage_platform_interface: ^2.0.0
  flutter_launcher_icons: ^0.14.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf

# Иконка приложения из знака S сайта: pnpm/flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/icon-512.png
  adaptive_icon_background: "#e8ebf0"
  adaptive_icon_foreground: assets/images/icon-foreground.png
  min_sdk_android: 26
